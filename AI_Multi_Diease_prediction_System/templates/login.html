<!DOCTYPE html>
<html>
<head>
    <title>Login</title>

    <style>

body{
    font-family:Arial;
    background:linear-gradient(135deg,#4facfe,#00f2fe);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.box{
    background:white;
    padding:40px;
    width:350px;
    border-radius:15px;
    box-shadow:0px 10px 20px rgba(0,0,0,.3);
}

h2{
    text-align:center;
    color:#1565c0;
}

input{
    width:100%;
    padding:12px;
    margin:12px 0;
    border-radius:8px;
    border:1px solid #ccc;
}

button{
    width:100%;
    padding:12px;
    border:none;
    background:#1565c0;
    color:white;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0d47a1;
}

p{
    text-align:center;
}

a{
    color:#1565c0;
    text-decoration:none;
}

    </style>

</head>

<body>

<div class="box">

<h2>User Login</h2>

<form action="/login" method="POST">

<input type="email" name="email" placeholder="Email" required>

<input type="password" name="password" placeholder="Password" required>

<button type="submit">Login</button>

</form>

<p>Don't have an account?
<a href="/register">Register</a>
</p>

</div>

</body>
</html>
