<!DOCTYPE html>
<html>
<head>
<title>Diabetes Prediction</title>

<style>

body{
margin:0;
font-family:Arial;
background:linear-gradient(135deg,#72209f,#b1b8d8,#a753c5);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{

background:white;
padding:40px;
border-radius:20px;
width:600px;
box-shadow:0 15px 30px rgba(0,0,0,.3);

}

h2{

text-align:center;
color:#0077b6;

}

input{

width:100%;
padding:12px;
margin-top:10px;
margin-bottom:15px;
border-radius:10px;
border:1px solid #ccc;

}

button{

width:100%;
padding:15px;
background:#0077b6;
color:white;
font-size:18px;
border:none;
border-radius:10px;
cursor:pointer;

}

button:hover{

background:#023e8a;

}

.result{

margin-top:20px;
font-size:22px;
font-weight:bold;
text-align:center;
color:green;

}

a{

            text-decoration:none;

 }

.back{

            display:block;
            margin-top:20px;
            text-align:center;

    }

</style>

</head>

<body>

<div class="container">

<h2>Diabetes Prediction</h2>

<form method="POST">

<input type="number" name="Pregnancies" placeholder="Pregnancies" required>

<input type="number" name="Glucose" placeholder="Glucose" required>

<input type="number" name="BloodPressure" placeholder="Blood Pressure" required>

<input type="number" name="SkinThickness" placeholder="Skin Thickness" required>

<input type="number" name="Insulin" placeholder="Insulin" required>

<input type="number" step="0.1" name="BMI" placeholder="BMI" required>

<input type="number" step="0.01" name="DiabetesPedigreeFunction" placeholder="Diabetes Pedigree Function" required>

<input type="number" name="Age" placeholder="Age" required>

<button type="submit">

Predict

</button>

</form>

{% if prediction %}

<div class="result">

{{ prediction }}

</div>

{% endif %}

<div class="back">

<a href="/dashboard">⬅ Back to Dashboard</a>

</div>


</div>

</body>

</html>
