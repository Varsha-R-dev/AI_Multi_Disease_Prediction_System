<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AI Multi Disease Prediction System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:linear-gradient(135deg,#d4fc79,#96e6a1,#4facfe,#00c6fb);

height:100vh;
display:flex;
justify-content:center;
align-items:center;

}

.container{

background:white;
width:700px;
padding:50px;
border-radius:20px;
text-align:center;
box-shadow:0 15px 35px rgba(0,0,0,0.3);

}

h1{

color:#0d47a1;
font-size:40px;
margin-bottom:20px;

}

p{

font-size:22px;
color:#555;
margin-bottom:35px;

}

.btn{

display:inline-block;
padding:15px 35px;
margin:10px;
text-decoration:none;
font-size:20px;
font-weight:bold;
border-radius:40px;
background:#1976d2;
color:white;
transition:.3s;

}

.btn:hover{

background:#0d47a1;
transform:scale(1.08);

}

.footer{

margin-top:40px;
font-size:18px;
color:green;
font-weight:bold;

}

</style>

</head>

<body>

<div class="container">

<h1>🩺 AI Multi Disease Prediction System</h1>

<p>Predict Diseases Early • Stay Healthy • Save Lives</p>

<a href="/login" class="btn">Login</a>

<a href="/register" class="btn">Register</a>

<div class="footer">

💚 Powered by Artificial Intelligence & Machine Learning

</div>

</div>

</body>

</html>
