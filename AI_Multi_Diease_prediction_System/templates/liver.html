<!DOCTYPE html>
<html>
<head>
    <title>Liver Disease Prediction</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial,sans-serif;
            background:linear-gradient(135deg,#72209f,#b1b8d8,#a753c5);
        }

        .container{
            width:700px;
            margin:40px auto;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 0 20px rgba(0,0,0,0.3);
        }

        h2{
            text-align:center;
            color:#0b5ed7;
        }

        table{
            width:100%;
        }

        td{
            padding:8px;
        }

        input,select{
            width:100%;
            padding:10px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            padding:12px;
            background:#0b5ed7;
            color:white;
            border:none;
            border-radius:6px;
            font-size:16px;
            cursor:pointer;
        }

        button:hover{
            background:#084298;
        }

        h3{
            text-align:center;
            color:green;
            margin-top:20px;
        }

        a{
            display:block;
            text-align:center;
            margin-top:20px;
            text-decoration:none;
            color:#0b5ed7;
            font-weight:bold;
        }
    </style>

</head>

<body>

<div class="container">

<h2>Liver Disease Prediction</h2>

<form method="POST">

<table>

<tr>
<td>Age</td>
<td><input type="number" name="Age" required></td>
</tr>

<tr>
<td>Gender</td>
<td>
<select name="Gender">
<option value="1">Male</option>
<option value="0">Female</option>
</select>
</td>
</tr>

<tr>
<td>Total Bilirubin</td>
<td><input type="number" step="any" name="Total_Bilirubin" required></td>
</tr>

<tr>
<td>Direct Bilirubin</td>
<td><input type="number" step="any" name="Direct_Bilirubin" required></td>
</tr>

<tr>
<td>Alkaline Phosphotase</td>
<td><input type="number" step="any" name="Alkaline_Phosphotase" required></td>
</tr>

<tr>
<td>Alamine Aminotransferase</td>
<td><input type="number" step="any" name="Alamine_Aminotransferase" required></td>
</tr>

<tr>
<td>Aspartate Aminotransferase</td>
<td><input type="number" step="any" name="Aspartate_Aminotransferase" required></td>
</tr>

<tr>
<td>Total Proteins</td>
<td><input type="number" step="any" name="Total_Protiens" required></td>
</tr>

<tr>
<td>Albumin</td>
<td><input type="number" step="any" name="Albumin" required></td>
</tr>

<tr>
<td>Albumin/Globulin Ratio</td>
<td><input type="number" step="any" name="Albumin_and_Globulin_Ratio" required></td>
</tr>

<tr>
<td colspan="2">
<button type="submit">
Predict
</button>
</td>
</tr>

</table>

</form>

{% if prediction %}
<h3>{{ prediction }}</h3>
{% endif %}

<a href="/dashboard">⬅ Back to Dashboard</a>

</div>

</body>
</html>
