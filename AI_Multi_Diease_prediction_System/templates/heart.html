<!DOCTYPE html>
<html>
<head>

    <title>Heart Disease Prediction</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:linear-gradient(135deg,#72209f,#b1b8d8,#a753c5);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;

        }

        .container{

            width:700px;
            background:white;
            padding:35px;
            border-radius:20px;
            box-shadow:0px 15px 30px rgba(0,0,0,.3);

        }

        h1{

            text-align:center;
            color:#0066cc;
            margin-bottom:25px;

        }

        .row{

            display:grid;
            grid-template-columns:1fr 1fr;
            gap:15px;

        }

        input{

            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;

        }

        button{

            width:100%;
            padding:14px;
            margin-top:25px;
            border:none;
            border-radius:10px;
            background:#007bff;
            color:white;
            font-size:18px;
            cursor:pointer;

        }

        button:hover{

            background:#0056b3;

        }

        .result{

            margin-top:25px;
            text-align:center;
            font-size:22px;
            font-weight:bold;
            color:green;

        }

        a{

            text-decoration:none;

        }

        .back{

            display:block;
            margin-top:20px;
            text-align:center;

        }

    </style>

</head>

<body>

<div class="container">

<h1>❤️ Heart Disease Prediction</h1>

<form method="POST">

<div class="row">

<input type="number" name="age" placeholder="Age" required>

<input type="number" name="sex" placeholder="Sex (1=Male,0=Female)" required>

<input type="number" name="cp" placeholder="Chest Pain Type" required>

<input type="number" name="trestbps" placeholder="Resting Blood Pressure" required>

<input type="number" name="chol" placeholder="Cholesterol" required>

<input type="number" name="fbs" placeholder="Fasting Blood Sugar" required>

<input type="number" name="restecg" placeholder="Rest ECG" required>

<input type="number" name="thalach" placeholder="Maximum Heart Rate" required>

<input type="number" name="exang" placeholder="Exercise Induced Angina" required>

<input type="number" step="0.1" name="oldpeak" placeholder="Old Peak" required>

<input type="number" name="slope" placeholder="Slope" required>

<input type="number" name="ca" placeholder="Number of Major Vessels" required>

<input type="number" name="thal" placeholder="Thal" required>

</div>

<button type="submit">

Predict Heart Disease

</button>

</form>

{% if prediction %}

<div class="result">

{{ prediction }}

</div>

{% endif %}

<div class="back">

<a href="/dashboard">⬅ Back to Dashboard</a>

</div>

</div>

</body>

</html>
